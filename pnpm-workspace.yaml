packages:
  - 'apps/*'
  - 'packages/*'
allowBuilds:
  # esbuild باینری بومی پلتفرم را در نصب لینک می‌کند — بدون این، vite و vitest بالا نمی‌آیند
  esbuild: true
  # msw فایل سرویس‌ورکر را با نسخه‌ی نصب‌شده هم‌گام نگه می‌دارد؛
  # نسخه‌ی کهنه‌ی mockServiceWorker.js خطاهای گیج‌کننده می‌سازد
  msw: true
  # swc باینری بومی را برای تبدیل دکوراتورهای NestJS در تست‌ها لینک می‌کند
  '@swc/core': true
  # BE-070: وابستگی swagger-ui-dist؛ اسکریپت نصبش فقط آمار استفاده به سرور scarf می‌فرستد —
  # روی سرور مالی هیچ تماس خروجی ناخواسته‌ای اجرا نمی‌شود.
  '@scarf/scarf': false
overrides:
  # FE-087: echarts و zrender نسخه‌ی tslib را دقیقاً روی 2.3.0 قفل کرده‌اند و Radix (از راه
  # react-remove-scroll) ‎^2 می‌خواهد؛ نتیجه دو نسخه‌ی tslib در خروجی بود. tslib 2.x سازگار
  # به عقب است، پس همان یک نسخه‌ی تازه‌تر برای همه کافی است.
  'tslib@2.3.0': 2.8.1
