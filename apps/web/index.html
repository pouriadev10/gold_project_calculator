<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1c1917" />
    <meta name="description" content="حسابداری طلا و سکه — واحد پایه طلاست، نه ریال" />

    <!--
      فونت لوکال است (هیچ CDN خارجی: شبکه‌ی ایران) ولی عمداً `preload`
      نمی‌شود. روی 3G، پیش‌بارگذاری فونت پهنای باند را از جاوااسکریپتی
      می‌دزدد که تا نیاید هیچ چیزی رندر نمی‌شود. با `font-display: swap`
      متن فوراً با فونت جایگزین می‌آید و فونت اصلی بعداً می‌نشیند.
      اندازه‌گیری‌شده: این تغییر LCP را حدود ۲ ثانیه کم کرد.
    -->
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />

    <title>حساب طلا</title>

    <!--
      پوسته‌ی اولیه به‌صورت inline.
      این یک SPA است: تا جاوااسکریپت اجرا نشود هیچ پیکسلی نقاشی نمی‌شود.
      این اسکلت بدون هیچ درخواست شبکه‌ای بلافاصله رنگ می‌گیرد و LCP را
      از «پایان اجرای React» به «رسیدن HTML» جابه‌جا می‌کند.
      React هنگام mount محتوای #root را جایگزین می‌کند.
    -->
    <style>
      :root {
        color-scheme: light;
        --shell-bg: #faf9f7;
        --shell-fg: #1c1917;
        --shell-bar: #f1efeb;
        --shell-card: #ffffff;
        --shell-border: #e6e1da;
      }
      html.dark {
        color-scheme: dark;
        --shell-bg: #16130f;
        --shell-fg: #f4f0e9;
        --shell-bar: #2c2621;
        --shell-card: #1f1b17;
        --shell-border: #4f463d;
      }
      html,
      body {
        margin: 0;
        background: var(--shell-bg);
        color: var(--shell-fg);
        font-family: Vazirmatn, system-ui, sans-serif;
      }
      #app-shell {
        padding: 12px 16px;
      }
      #app-shell .bar {
        height: 92px;
        border-radius: 12px;
        background: var(--shell-bar);
        margin-block-end: 12px;
      }
      #app-shell .card {
        height: 168px;
        border-radius: 12px;
        background: var(--shell-card);
        border: 1px solid var(--shell-border);
        margin-block-end: 12px;
      }
      #app-shell .title {
        font-size: 14px;
        font-weight: 700;
        margin-block-end: 12px;
      }
    </style>

    <!--
      پوسته پیش از اولین رنگ‌آمیزی تعیین می‌شود.

      اگر این اسکریپت نباشد، صفحه یک لحظه سفید بالا می‌آید و بعد تیره
      می‌شود — همان پرشی که در حالت شب چشم را می‌زند. عمداً همین‌جا و
      به‌صورت همگام (بدون defer) نشسته تا پیش از رندر اجرا شود.

      کلید `gold-ui-theme` با استور Zustand مشترک است؛ اگر آنجا عوض شد،
      اینجا هم باید عوض شود.
    -->
    <script>
      (function () {
        try {
          var raw = localStorage.getItem('gold-ui-theme');
          var mode = raw ? JSON.parse(raw).state.theme : 'system';
          var isDark =
            mode === 'dark' ||
            (mode === 'system' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) document.documentElement.classList.add('dark');
        } catch (e) {
          /* اگر localStorage در دسترس نبود، حالت روشن پیش‌فرض است */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <div id="app-shell">
        <p class="title">حساب طلا</p>
        <div class="bar"></div>
        <div class="card"></div>
        <div class="card"></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
